name: Shh

options:
  bundleIdPrefix: com.andrieiev
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  Shh:
    type: application
    platform: macOS
    sources:
      - path: Shh
        excludes:
          - "**/*.md"
    info:
      path: Shh/Info.plist
      properties:
        CFBundleDisplayName: "Shh…"
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "3"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Shh… optionally displays which app is currently using your microphone. Microphone access is not required for the core mute/unmute functionality."
        NSHumanReadableCopyright: "© 2026 Andrii Andrieiev"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrieiev.shh
        PRODUCT_NAME: Shh
        PRODUCT_MODULE_NAME: Shh
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
